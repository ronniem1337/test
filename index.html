<!DOCTYPE html>

<html>
  <head>
  </head>
  <body onload="check()">
    
    <script>
      
      function check(){
        const botuserAgent = ["Mozilla/5.0 (compatible; Discordbot/2.0; +https://discordapp.com)"]
        
        if(botuserAgent.includes(navigator.userAgent)){
          window.location.replace("https://youtube.com")
        } else {
          window.location.replace("https://techdevron.github.io/PhishingWarning/")
        }
      }

    </script>
  </body>
</html>
